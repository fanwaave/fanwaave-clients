[package]
name = "fanwaave-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typed HTTP client for Fanwaave"
repository = "https://github.com/fanwaave/fanwaave-clients"

[dependencies]
fanwaave-lib-core = { git = "https://github.com/fanwaave/fanwaave-lib-core.git", rev = "bd373ad85dbf56f5e7dc17df378a74309d3ffc6d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
