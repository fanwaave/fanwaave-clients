[package]
name = "fanwaave-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typed HTTP client for Fanwaave"
repository = "https://github.com/fanwaave/fanwaave-clients"

[dependencies]
fanwaave-interfaces = { git = "https://github.com/fanwaave/fanwaave-interfaces.git", rev = "ac25bcb15746e16c52ea6592ee3cb1ec34a9da47" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
