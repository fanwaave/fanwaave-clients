[help]
url = "https://github.com/fanwaave/fanwaave-clients"

[env]
load = false

[parse]
allow_unknown = false

[flags.api-base]
env = "FANWAAVE_API_BASE_URL"
aliases = ["api-base"]
type = "string"
help = "Fanwaave API base URL. Domain typing and defaults are owned by .fanwaave-cfg.toml."

[flags.tenant-id]
env = "FANWAAVE_TENANT_ID"
aliases = ["tenant-id"]
type = "string"
help = "Optional Fanwaave tenant identifier."
