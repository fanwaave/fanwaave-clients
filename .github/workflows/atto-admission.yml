name: AttoLang client admission
on:
  push:
    branches: [dev]
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'scripts/atto-admission.mjs', 'test/atto-admission.test.mjs', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
  pull_request:
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'scripts/atto-admission.mjs', 'test/atto-admission.test.mjs', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head, AttoLang admission and clean diff
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --test test/atto-admission.test.mjs
          git diff --check
