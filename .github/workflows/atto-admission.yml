name: AttoLang client admission
on:
  push:
    branches: [dev]
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'scripts/atto-admission.mjs', 'test/atto-admission.test.mjs', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
  pull_request:
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'scripts/atto-admission.mjs', 'test/atto-admission.test.mjs', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/atto-admission.test.mjs
