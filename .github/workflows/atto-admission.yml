name: AttoLang client admission
on:
  push:
    branches: [dev]
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'clients/rust/tests/atto_admission.rs', 'tools/atto-admission-rs/**', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
  pull_request:
    paths: ['clients/atto/**', 'clients/support-matrix.toml', 'clients/rust/tests/atto_admission.rs', 'tools/atto-admission-rs/**', 'rpc/public-projection.v1.json', '.github/workflows/atto-admission.yml']
permissions:
  contents: read
jobs:
  rust-atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Check focused Rust test crate formatting
        run: cargo fmt --manifest-path tools/atto-admission-rs/Cargo.toml --check
      - name: Run real Rust contract tests
        run: cargo test --manifest-path tools/atto-admission-rs/Cargo.toml --all-targets
      - name: Lint focused Rust test crate
        run: cargo clippy --manifest-path tools/atto-admission-rs/Cargo.toml --all-targets -- -D warnings
