name: rust-runtime-config

on:
  pull_request:
    paths:
      - "clients/rust/**"
      - ".github/workflows/rust-runtime-config.yml"
  push:
    branches: [main]
    paths:
      - "clients/rust/**"
      - ".github/workflows/rust-runtime-config.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Test canonical Fanwaave runtime client config
        run: cargo test --manifest-path clients/rust/Cargo.toml --all-targets
