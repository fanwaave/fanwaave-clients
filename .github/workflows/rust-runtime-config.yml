name: rust-runtime-config

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "clients/rust/**"
      - ".cli-flags.toml"
      - ".fanwaave-cfg.toml"
      - ".ores-mw.toml"
      - ".github/workflows/rust-runtime-config.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "clients/rust/**"
      - ".cli-flags.toml"
      - ".fanwaave-cfg.toml"
      - ".ores-mw.toml"
      - ".github/workflows/rust-runtime-config.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact flags2env parser used by fanwaave-lib-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: flags-2-env/flags-2-env
          ref: c7f720d7501921b5a1b42c395b5a6fe271f24332
          path: tmp/flags2env
          persist-credentials: false
      - name: Audit repository CLI contract with exact pinned flags2env
        run: |
          make -C tmp/flags2env cli
          tmp/flags2env/build/flags2env audit .cli-flags.toml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Test canonical Fanwaave runtime client config from workspace root
        run: cargo test --workspace --all-targets
      - name: Prove git package discovery from repository root
        shell: bash
        run: |
          set -euo pipefail
          test "$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(sum(1 for p in json.load(sys.stdin)["packages"] if p["name"] == "fanwaave-client"))')" = "1"
