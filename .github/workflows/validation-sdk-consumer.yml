name: validation-sdk-consumer

on:
  pull_request:
    paths:
      - "validation-consumer/**"
      - "scripts/check-validation-imports.py"
      - "tools/validation-imports-rs/**"
      - ".github/workflows/validation-sdk-consumer.yml"
      - ".zpkg.toml"
  push:
    branches: [main, dev]
    paths:
      - "validation-consumer/**"
      - "scripts/check-validation-imports.py"
      - ".github/workflows/validation-sdk-consumer.yml"
      - ".zpkg.toml"

permissions:
  contents: read

jobs:
  public-validation-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fanwaave/fanwaave-lib-core
          ref: c69a940292a269c951489c51a670421c90eda977
          path: .deps/lib-core
          persist-credentials: false
      - name: Verify candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/validation-imports-rs/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/validation-imports-rs/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/validation-imports-rs/Cargo.toml --all-targets
      - run: cargo run --manifest-path tools/validation-imports-rs/Cargo.toml --quiet
      - run: npm install --prefix .deps/lib-core/validation/typescript
      - run: npm run build --prefix .deps/lib-core/validation/typescript
      - run: npm install --prefix validation-consumer/typescript
      - run: npm run build --prefix validation-consumer/typescript
      - run: npm test --prefix validation-consumer/typescript
      - run: cargo test --manifest-path validation-consumer/rust/Cargo.toml
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.25.x"
          cache: false
      - run: go test -mod=mod ./...
        working-directory: validation-consumer/golang
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.0"
          gleam-version: "1.14.0"
      - run: gleam test --target erlang
        working-directory: validation-consumer/gleam
      - run: gleam check --target javascript
        working-directory: validation-consumer/gleam
