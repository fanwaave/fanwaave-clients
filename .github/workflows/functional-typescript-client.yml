name: functional TypeScript client

on:
  pull_request:
    paths:
      - "clients/typescript/**"
      - ".github/workflows/functional-typescript-client.yml"
  push:
    branches: [main]
    paths:
      - "clients/typescript/**"
      - ".github/workflows/functional-typescript-client.yml"

permissions:
  contents: read

concurrency:
  group: functional-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Run immutable config regression tests
        run: npm exec --yes --package=tsx@4.20.5 -- tsx --test clients/typescript/test/immutable-config.test.ts
