[package]
org = "fanwaave"
name = "fanwaave-clients"
version = "0.1.0"
description = "Polyglot clients for fanwaave"
license = "MIT"

[dependencies]
"fanwaave/fanwaave-interfaces" = "^0.1.0"
"fanwaave/fanwaave-pub-lib-core" = "^0.1.0"
"oresoftware/api-docs" = "=2.0.3"
"oresoftware/typespec-json-schema-validator" = "=0.1.1"

[targets.repository]
dir = "."

[targets.validation-consumer]
dir = "validation-consumer"
adapter = "none"

[publish]
include_readme = true
tag_format = "v{version}"
